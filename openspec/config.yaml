schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: AutoInsight. Infer business scope and technology only from checked-in
  source and approved changes, never from the project name.
  Read AGENTS.md and CONTRIBUTING.md before acting. Use repo-local spec-driven
  changes as the only requirements and implementation-task source of truth.
  ChatGPT plans/reviews; Codex implements/integrates/tests and dispatches Qwen;
  humans own Changes and approve specifications and code. AI review is advisory.
  One Change has one accountable Owner, one development branch and one delivery PR.
  Use only installer-generated integrations; Codex uses .agents/skills and Qwen
  uses .qwen/commands plus .qwen/skills. Preserve unrelated user edits.

rules:
  proposal:
    - Include Change ID, human Owner (or explicitly pending assignment), scope and exclusions.
    - Record the specification-review evidence or clearly mark it pending.
  specs:
    - Use SHALL/MUST and at least one concrete WHEN/THEN Scenario per Requirement.
    - Put proposed requirements in change delta specs, not in openspec/specs.
  design:
    - Document shared interfaces, file ownership, dependencies and conflict handling when parallel work is planned.
    - Distinguish verified results from assumptions, unavailable checks and outstanding review.
  tasks:
    - Use native Markdown checkboxes; mark only completed and verified work as done.
    - Keep implementation tasks separate from external review, merge and archive follow-up.

operations:
  apply:
    guidance:
      - Require recorded specification approval and a human Owner before business development.
      - Scope Qwen assignments to explicit files and tasks; Codex verifies returned evidence.
      - Run relevant tests; AI-generated code also requires human review before merge.
  archive:
    guidance:
      - Archive requirement-bearing Changes only after their delivery PR is merged and acceptance is recorded.
      - Deliver archive updates through a separately reviewed maintenance Change and PR; never write directly to main.
      - Do not sync pending requirement deltas into formal specs during proposal or development.
