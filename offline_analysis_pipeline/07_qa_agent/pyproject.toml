[project]
name = "qa-agent"
version = "0.1.0"
description = "SU7 report Q&A via LLM RAG (stdlib-only, pluggable OpenAI-compatible LLM)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qa-agent = "qa_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
