<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>事件聚合工具 · 本地</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#10151e;color:#e4eaf3}*{box-sizing:border-box}body{margin:0}header{padding:24px 4vw;border-bottom:1px solid #2b3648;background:#171f2c}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:0 0 16px}.muted{color:#9eabc0;font-size:13px;line-height:1.7}main{padding:24px 4vw;display:grid;grid-template-columns:330px 1fr;gap:24px}.panel{background:#171f2c;border:1px solid #2b3648;border-radius:12px;padding:20px;margin-bottom:20px}label{display:block;font-size:14px;margin-bottom:7px}input,select,button{font:inherit}input,select{background:#10151e;border:1px solid #39485e;border-radius:7px;color:#e4eaf3;padding:10px;width:100%;margin-bottom:16px}button,.download{border:0;border-radius:7px;background:#5d96fa;color:#0b1423;padding:11px 16px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:wait}.checks label{display:flex;gap:8px;align-items:center}.checks input{width:auto;margin:0}.checks{margin-bottom:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.badge{padding:4px 9px;border-radius:5px;background:#26354b;color:#9ac1ff;font-size:12px}.job{display:block;width:100%;margin-top:8px;text-align:left;background:#253145;color:#e4eaf3;font-weight:400}.event{padding:18px 0;border-top:1px solid #2b3648}.event h3{margin:8px 0;font-size:18px}.event p{line-height:1.8;margin:8px 0}.sources a{color:#93baff;display:block;word-break:break-all;font-size:13px;margin:6px 0}progress{width:100%;height:12px;margin:12px 0}#error{color:#ff9e9e;white-space:pre-wrap}#results[hidden]{display:none}a{color:#93baff}details{margin-top:12px}pre{white-space:pre-wrap;font-size:12px;max-height:300px;overflow:auto}#search{margin:16px 0 0}footer{padding:0 4vw 30px}@media(max-width:850px){main{grid-template-columns:1fr}}button:focus-visible,a:focus-visible{outline:3px solid #b7d1ff;outline-offset:3px}
</style>
<header><h1>事件聚合工具 <span class="badge">本地运行</span></h1><div class="muted">火山引擎搜索 → 来源过滤 → 日期归一 → 事件聚类 → 摘要 → JSON / TXT</div><div id="config" class="muted">正在检查配置…</div></header>
<main><aside><form id="form" class="panel"><h2>启动调研</h2><label for="brand">品牌</label><input id="brand" value="小米" required maxlength="30"><label for="product">产品</label><input id="product" value="SU7" required maxlength="30"><label for="from">开始日期</label><input id="from" type="date" value="2026-08-01" required><label for="to">结束日期</label><input id="to" type="date" value="2026-08-31" required><label>研究主题</label><div class="checks"><label><input type="checkbox" value="product" checked>本品动作</label><label><input type="checkbox" value="competitor" checked>竞品动态</label><label><input type="checkbox" value="policy" checked>政策法规</label><label><input type="checkbox" value="tech" checked>技术动向</label><label><input type="checkbox" value="public" checked>舆情热点</label></div><label for="hint">领域提示（可选）</label><input id="hint" placeholder="如：汽车" maxlength="20"><label for="domains">官方域名（可选，逗号分隔）</label><input id="domains" placeholder="如：xiaomi.com"><button id="start" type="submit">开始聚合</button><p class="muted">启动后会使用搜索配额。每次处理一个产品；跨多年时间窗会增加查询数量。</p></form><section class="panel"><h2>调研记录</h2><div id="history" class="muted">暂无记录</div></section></aside>
<section><div class="panel"><h2 id="status">选择记录或启动新调研</h2><div id="progressText" class="muted">任务与结果会保存在本机。</div><progress id="progress" value="0" max="1"></progress><div id="error" role="alert"></div></div><div id="results" class="panel" hidden><div class="row"><h2 id="resultTitle" style="margin:0;flex:1"></h2><a id="json" class="download">下载 JSON</a><a id="txt" class="download">下载 TXT</a></div><p id="resultMeta" class="muted"></p><input id="search" placeholder="搜索事件标题、摘要或来源" aria-label="搜索事件"><div id="events"></div><details><summary>检索与过滤统计</summary><pre id="stats"></pre></details></div></section></main>
<footer class="muted">时间线日期依据报道发布时间，不等于独立核验的事件发生时间。权威分是规则评分；本地运行成功不代表事件准确率已人工验收。</footer>
<script>
const $=id=>document.getElementById(id);let active=null,events=[],timer=null;
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options){const r=await fetch(path,options),data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data}
const states={queued:'等待开始',running:'调研运行中',completed:'调研完成',failed:'调研失败',interrupted:'任务已中断'};
async function history(){const jobs=await api('/api/jobs');$('history').textContent='';if(!jobs.length)$('history').textContent='暂无记录';for(const j of jobs){const b=document.createElement('button');b.className='job';b.textContent=`${j.input.brand} ${j.input.product} · ${states[j.status]||j.status}\n${j.created_at.slice(0,16)}`;b.onclick=()=>watch(j.id);$('history').append(b)}$('start').disabled=jobs.some(j=>['queued','running'].includes(j.status));return jobs}
function render(){const term=$('search').value.toLowerCase();$('events').innerHTML=events.filter(e=>JSON.stringify(e).toLowerCase().includes(term)).map(e=>`<article class="event"><div class="row"><span class="badge">${escape(e.event_date||'日期未知')} · ${escape(e.date_precision)}</span><span class="badge">${escape(e.event_type)} / ${escape(e.subtype)}</span><span class="muted">权威分 ${escape(e.authority)} · ${escape(e.media_coverage.source_count)} 家来源</span></div><h3>${escape(e.title)}</h3><p>${escape(e.summary)}</p><details class="sources"><summary>来源 ${e.sources.length} 条</summary>${e.sources.map(s=>`<a href="${escape(/^https?:\/\//i.test(s.url)?s.url:'#')}" target="_blank" rel="noopener noreferrer">${escape(s.source_tier)} · ${escape(s.title)} · ${escape(s.source_domain)}<br>${escape(s.url)}</a>`).join('')}</details></article>`).join('')||'<p class="muted">没有匹配的事件。</p>'}
async function poll(){try{const j=await api('/api/jobs/'+active);$('status').textContent=`${states[j.status]||j.status} · ${j.input.brand} ${j.input.product}`;$('progressText').textContent=`${j.phase} · 搜索 ${j.completed_queries} / ${j.query_count} 条`;$('progress').max=j.query_count||1;$('progress').value=j.completed_queries;$('error').textContent=j.error||'';if(j.status==='completed'){clearInterval(timer);timer=null;const t=await api('/api/jobs/'+active+'/result');events=t.events;$('results').hidden=false;$('resultTitle').textContent=`${t.meta.brand} ${t.meta.product} · ${events.length} 条事件`;$('resultMeta').textContent=`结果状态：${t.meta.status} · 摘要：${t.meta.llm_used?'模型改写':'原句回退'} · ${t.meta.generated_at}`;$('json').href='/api/jobs/'+active+'/json';$('txt').href='/api/jobs/'+active+'/txt';$('stats').textContent=JSON.stringify(t.meta,null,2);render();await history()}else if(['failed','interrupted'].includes(j.status)){clearInterval(timer);timer=null;await history()}}catch(e){$('error').textContent=e.message;clearInterval(timer);timer=null}}
function watch(id){clearInterval(timer);active=id;$('results').hidden=true;$('error').textContent='';$('search').value='';poll();timer=setInterval(poll,2000)}
$('search').oninput=render;
$('form').onsubmit=async e=>{e.preventDefault();$('start').disabled=true;$('error').textContent='';try{const j=await api('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand:$('brand').value,product:$('product').value,time_from:$('from').value,time_to:$('to').value,aspects:[...document.querySelectorAll('.checks input:checked')].map(x=>x.value),domain_hint:$('hint').value,official_domains:$('domains').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean)})});watch(j.id);await history()}catch(e){$('error').textContent=e.message;await history()}};
async function init(){try{const c=await api('/api/config');$('config').textContent=`搜索：${c.search?'已配置':'未配置'} · 摘要：${c.llm?'模型已配置':'原句回退'} · 相似度：${c.embedding?'向量模型已配置':'本地字符向量'}`;const jobs=await history();const running=jobs.find(j=>['running','queued'].includes(j.status));if(running)watch(running.id);else if(jobs.length)watch(jobs[0].id)}catch(e){$('error').textContent=e.message}}init();
</script></html>
